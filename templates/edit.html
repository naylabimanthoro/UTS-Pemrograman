<!DOCTYPE html>
<html lang="id">
<head>
    <title>Edit Mahasiswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>Edit Data Mahasiswa</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
        <div class="mb-3">
            <label>NIM (Tidak bisa diubah)</label>
            <input type="number" name="nim" class="form-control" value="{{ mhs.nim }}" disabled>
        </div>
        <div class="mb-3">
            <label>Nama Lengkap</label>
            <input type="text" name="nama" class="form-control" value="{{ mhs.nama }}" required>
        </div>
        <div class="mb-3">
            <label>Program Studi</label>
            <input type="text" name="program_studi" class="form-control" value="{{ mhs.program_studi }}" required>
        </div>
        <div class="mb-3">
            <label>Angkatan (Tahun)</label>
            <input type="number" name="angkatan" class="form-control" value="{{ mhs.angkatan }}" required>
        </div>
        <div class="mb-3">
            <label>IPK</label>
            <input type="number" step="0.01" name="ipk" class="form-control" value="{{ mhs.ipk }}" required>
        </div>
        <button type="submit" class="btn btn-warning">Update Data</button>
        <a href="/" class="btn btn-secondary">Batal</a>
    </form>
</body>
</html>
